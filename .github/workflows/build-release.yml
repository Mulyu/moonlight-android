name: Build & Release APK

# Builds the sideloadable nonRoot_game release APKs and publishes them as a
# rolling GitHub Release.
#
#   push to the release branch -> build + publish
#   pull request               -> build only (so a PR is verified before merge)
#   manual dispatch            -> build, and publish when asked to
#
# No repository secrets are required: without a release keystore the release
# variant falls back to debug signing (see app/build.gradle), which is enough to
# install the APK on a device. Supply the MOONLIGHT_RELEASE_* secrets to sign
# with a real key instead.
on:
  push:
    # This fork's default branch is `moonlight-noir`; `main` is listed too so the
    # workflow keeps working if the branch is ever renamed.
    branches:
      - main
      - moonlight-noir
  pull_request:
    branches:
      - main
      - moonlight-noir
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built APKs to the rolling "latest" release'
        required: true
        default: true
        type: boolean

# A newer push to the same ref supersedes an in-progress build.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  # Must match ndkVersion in app/build.gradle.
  ANDROID_NDK: '27.0.12077973'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # moonlight-common-c lives in app/src/main/jni as a submodule and the
          # ndkBuild step cannot compile without it.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The unit test suite is deliberately not run here. Five tests
      # (LayoutInflationTest, SimpleStartupTest, StartupTest and two in
      # ProfilesNavigationTest) already fail on the base branch, so gating the
      # release on them would mean this pipeline never publishes anything.
      # Run them with `./gradlew testNonRoot_gameDebugUnitTest`; once they are
      # fixed, add that step back here.
      - name: Build release APKs
        run: ./gradlew assembleNonRoot_gameRelease --no-daemon --stacktrace

      # The build splits by ABI, so name each APK after the ABI it targets and
      # keep the names stable: the release download URLs then never change.
      - name: Stage APKs
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          out="app/build/outputs/apk/nonRoot_game/release"
          shopt -s nullglob
          found=0
          for apk in "$out"/*.apk; do
            base="$(basename "$apk")"
            abi=""
            for candidate in arm64-v8a armeabi-v7a x86_64 x86; do
              case "$base" in
                *"$candidate"*) abi="$candidate"; break ;;
              esac
            done
            if [ -z "$abi" ]; then
              abi="universal"
            fi
            cp "$apk" "dist/artemis-${abi}.apk"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "No APKs were produced in $out" >&2
            exit 1
          fi
          ls -l dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artemis-nonroot-game-release-apks
          path: dist/*.apk
          if-no-files-found: error

      # GitHub always zips workflow artifacts. Publishing the same APKs as
      # release assets gives a one-click, unwrapped .apk download from a stable
      # URL: https://github.com/<owner>/<repo>/releases/download/latest/artemis-arm64-v8a.apk
      - name: Publish APKs to rolling release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK (build ${{ github.run_number }})
          body: |
            Automated sideload build of the `nonRoot_game` release variant.

            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Build: ${{ github.run_number }}

            Pick the APK for your device's ABI — **artemis-arm64-v8a.apk** covers
            virtually all modern phones. These are debug-signed unless a release
            keystore is configured, so uninstall any differently signed build first.
          prerelease: true
          make_latest: false
          files: dist/*.apk
